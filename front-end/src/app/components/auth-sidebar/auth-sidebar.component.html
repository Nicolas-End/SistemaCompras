<div class="hidden lg:flex flex-col justify-between h-full p-10 bg-gradient-to-br from-sidebar via-primary to-accent text-white">
  <!-- Logo -->
  <div>
    <div *ngIf="logoSrc; else defaultLogo" class="h-12 mb-2">
      <img [src]="logoSrc" [alt]="companyName" class="h-full w-auto object-contain brightness-0 invert" />
    </div>
    <ng-template #defaultLogo>
      <div class="flex items-center gap-3 mb-2">
        <div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
        </div>
        <span class="text-2xl font-bold">{{ companyName }}</span>
      </div>
    </ng-template>
    <p class="text-white/70 text-sm">Sistema de Gestão Empresarial</p>
  </div>

  <!-- Features -->
  <div class="space-y-8">
    <h2 class="text-3xl font-bold leading-tight text-balance">
      Gerencie seu negócio de forma inteligente
    </h2>
    
    <div class="space-y-6">
      <div *ngFor="let feature of features" class="flex items-start gap-4">
        <div class="w-10 h-10 bg-white/20 backdrop-blur-sm rounded-lg flex items-center justify-center flex-shrink-0">
          <!-- Shield Icon -->
          <svg *ngIf="feature.icon === 'shield'" class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
          <!-- Zap Icon -->
          <svg *ngIf="feature.icon === 'zap'" class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          <!-- Users Icon -->
          <svg *ngIf="feature.icon === 'users'" class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </div>
        <div>
          <h3 class="font-semibold text-white">{{ feature.title }}</h3>
          <p class="text-white/70 text-sm">{{ feature.description }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="pt-8 border-t border-white/20">
    <p class="text-white/60 text-sm">
      &copy; {{ currentYear }} {{ companyName }}. Todos os direitos reservados.
    </p>
  </div>
</div>
